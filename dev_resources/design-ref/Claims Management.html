<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Claims Management · HR</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html, body { font-family: 'Geist', system-ui, -apple-system, sans-serif; }
  .font-mono { font-family: 'Geist Mono', ui-monospace, monospace; font-feature-settings: "tnum" 1; }
  .num-tabular { font-variant-numeric: tabular-nums; }
  .shad-card    { box-shadow: 0 1px 2px 0 rgb(16 24 40 / 0.04); }
  .shad-card-lg { box-shadow: 0 1px 2px rgb(16 24 40 / 0.04), 0 1px 3px rgb(16 24 40 / 0.06); }
  button:focus-visible, input:focus-visible {
    outline: 2px solid rgb(15 23 42 / 0.5); outline-offset: 2px;
  }
</style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-900 antialiased">

<!-- shared sparkline gradients -->
<svg width="0" height="0" class="absolute">
  <defs>
    <linearGradient id="gEmerald" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="rgb(16 185 129)" stop-opacity="0.22"/><stop offset="100%" stop-color="rgb(16 185 129)" stop-opacity="0"/></linearGradient>
    <linearGradient id="gRose" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="rgb(225 29 72)" stop-opacity="0.22"/><stop offset="100%" stop-color="rgb(225 29 72)" stop-opacity="0"/></linearGradient>
    <linearGradient id="gSlate" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="rgb(15 23 42)" stop-opacity="0.18"/><stop offset="100%" stop-color="rgb(15 23 42)" stop-opacity="0"/></linearGradient>
    <linearGradient id="gAmber" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="rgb(217 119 6)" stop-opacity="0.22"/><stop offset="100%" stop-color="rgb(217 119 6)" stop-opacity="0"/></linearGradient>
    <linearGradient id="gIndigo" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="rgb(79 70 229)" stop-opacity="0.22"/><stop offset="100%" stop-color="rgb(79 70 229)" stop-opacity="0"/></linearGradient>
  </defs>
</svg>

<div class="max-w-[1440px] mx-auto px-8 py-7">

  <!-- ========================================================== -->
  <!-- Header                                                      -->
  <!-- ========================================================== -->
  <header class="flex items-end justify-between gap-4 flex-wrap mb-6">
    <div>
      <div class="flex items-center gap-2 text-[12px] text-slate-500 mb-2">
        <a href="#" class="hover:text-slate-700">Finance</a>
        <span class="text-slate-300">/</span>
        <span class="text-slate-700">Claims</span>
      </div>
      <h1 class="text-[28px] font-semibold tracking-tight leading-none">Claims Management</h1>
      <p class="text-[13px] text-slate-500 mt-2">View and manage expense claims · <span class="text-slate-700">May 2026</span></p>
    </div>
    <div class="flex items-center gap-2">
      <!-- Enhancement: live "needs your action" badge button -->
      <button class="relative inline-flex items-center gap-2 h-10 px-3.5 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 text-[13px] font-medium text-slate-700 shad-card">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        Inbox
        <span class="inline-flex items-center justify-center min-w-[18px] h-[18px] px-1.5 rounded-full bg-rose-500 text-white text-[10.5px] font-semibold">7</span>
      </button>
      <button class="inline-flex items-center gap-2 h-10 px-3.5 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 text-[13px] font-medium text-slate-700 shad-card">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="9 12 11 14 15 10"/></svg>
        Approval Dashboard
      </button>
      <button class="inline-flex items-center gap-2 h-10 px-3.5 rounded-lg bg-slate-900 hover:bg-slate-800 text-white text-[13px] font-medium">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Submit Claim
      </button>
    </div>
  </header>

  <!-- ========================================================== -->
  <!-- KPI cards (Variant A)                                       -->
  <!-- ========================================================== -->
  <div id="stat-cards" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-4"></div>

  <!-- ========================================================== -->
  <!-- Insights row (NEW — enhancement)                            -->
  <!-- ========================================================== -->
  <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
    <div id="insight-categories"></div>
    <div id="insight-spenders"></div>
    <div id="insight-sla"></div>
  </div>

  <!-- ========================================================== -->
  <!-- Saved views (NEW — enhancement)                             -->
  <!-- ========================================================== -->
  <div class="flex items-center gap-2 flex-wrap mb-3 text-[12px]">
    <span class="text-slate-500 mr-1 font-medium">Saved views:</span>
    <button class="inline-flex items-center gap-1.5 h-8 px-3 rounded-lg border border-slate-300 bg-slate-900 text-white text-[12px] font-medium">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      Needs my action
      <span class="inline-flex items-center justify-center min-w-[18px] h-[16px] px-1 rounded-full bg-white/15 text-white text-[10.5px] font-semibold num-tabular">7</span>
    </button>
    <button class="inline-flex items-center gap-1.5 h-8 px-3 rounded-lg border border-slate-200 bg-white text-slate-700 hover:bg-slate-50 text-[12px] font-medium">Over RM 1,000</button>
    <button class="inline-flex items-center gap-1.5 h-8 px-3 rounded-lg border border-slate-200 bg-white text-slate-700 hover:bg-slate-50 text-[12px] font-medium">SLA breaching <span class="text-rose-600 font-semibold">3</span></button>
    <button class="inline-flex items-center gap-1.5 h-8 px-3 rounded-lg border border-slate-200 bg-white text-slate-700 hover:bg-slate-50 text-[12px] font-medium">My team</button>
    <button class="inline-flex items-center gap-1.5 h-8 px-2.5 rounded-lg border border-dashed border-slate-300 bg-white text-slate-500 hover:bg-slate-50 text-[12px] font-medium">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Save current
    </button>
  </div>

  <!-- ========================================================== -->
  <!-- Status pill tabs (CHANGED to pills)                         -->
  <!-- ========================================================== -->
  <div id="status-pills" class="flex items-center gap-2 flex-wrap mb-4"></div>

  <!-- ========================================================== -->
  <!-- Toolbar: search · filters · sort · density · export         -->
  <!-- ========================================================== -->
  <div class="flex items-center gap-2 flex-wrap mb-3">
    <div class="relative flex-1 min-w-[280px] max-w-[480px]">
      <svg class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" placeholder="Search by claimant, ID, vendor…" class="w-full h-9 pl-9 pr-12 rounded-lg border border-slate-200 bg-white text-[13px] text-slate-700 placeholder:text-slate-400 shad-card"/>
      <kbd class="absolute right-2 top-1/2 -translate-y-1/2 text-[10.5px] font-mono text-slate-400 bg-slate-100 px-1.5 h-5 rounded inline-flex items-center">⌘K</kbd>
    </div>

    <button class="inline-flex items-center gap-1.5 h-9 px-2.5 rounded-lg border border-dashed border-slate-300 bg-white hover:bg-slate-50 text-[12.5px] font-medium text-slate-700">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      Category
    </button>
    <button class="inline-flex items-center gap-1.5 h-9 px-2.5 rounded-lg border border-dashed border-slate-300 bg-white hover:bg-slate-50 text-[12.5px] font-medium text-slate-700">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      Date
    </button>
    <button class="inline-flex items-center gap-1.5 h-9 px-2.5 rounded-lg border border-dashed border-slate-300 bg-white hover:bg-slate-50 text-[12.5px] font-medium text-slate-700">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      Amount
    </button>

    <!-- active filter chip -->
    <div class="inline-flex items-center h-7 pl-2 pr-1 rounded-full bg-slate-900 text-white text-[11px] font-medium gap-1.5">
      <span class="text-white/60">Dept:</span> Engineering
      <button class="w-4 h-4 grid place-items-center rounded-full hover:bg-white/15" aria-label="Remove">
        <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <div class="ml-auto flex items-center gap-2">
      <!-- Density toggle (NEW) -->
      <div class="inline-flex h-9 rounded-lg border border-slate-200 bg-white p-0.5 shad-card text-[11.5px] font-medium" title="Row density">
        <button class="px-2 rounded-[6px] text-slate-500 hover:text-slate-800" aria-label="Compact">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="3" y1="14" x2="21" y2="14"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <button class="px-2 rounded-[6px] bg-slate-900 text-white" aria-label="Default">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <button class="px-2 rounded-[6px] text-slate-500 hover:text-slate-800" aria-label="Comfortable">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
      </div>
      <!-- Sort -->
      <button class="inline-flex items-center gap-1.5 h-9 px-2.5 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 text-[12.5px] font-medium text-slate-700 shad-card">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="11" y1="5" x2="21" y2="5"/><line x1="11" y1="9" x2="17" y2="9"/><line x1="11" y1="13" x2="15" y2="13"/><polyline points="3 17 6 20 9 17"/><line x1="6" y1="4" x2="6" y2="20"/></svg>
        Newest first
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-400"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <button class="inline-flex items-center gap-1.5 h-9 px-2.5 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 text-[12.5px] font-medium text-slate-700 shad-card">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Export
      </button>
    </div>
  </div>

  <!-- ========================================================== -->
  <!-- Bulk action bar (NEW — visible when rows selected)          -->
  <!-- ========================================================== -->
  <div class="rounded-xl border border-indigo-200 bg-indigo-50/60 px-3 py-2 flex items-center gap-3 mb-3 text-[12.5px]">
    <span class="inline-flex items-center gap-1.5 font-semibold text-indigo-900">
      <span class="inline-flex items-center justify-center w-5 h-5 rounded bg-indigo-600 text-white text-[10.5px] font-semibold">1</span>
      selected
    </span>
    <span class="h-4 w-px bg-indigo-200"></span>
    <button class="inline-flex items-center gap-1 h-7 px-2 rounded-md bg-emerald-600 hover:bg-emerald-700 text-white text-[11.5px] font-semibold">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      Approve all
    </button>
    <button class="inline-flex items-center gap-1 h-7 px-2 rounded-md bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 text-[11.5px] font-semibold">
      Reject all
    </button>
    <button class="inline-flex items-center gap-1 h-7 px-2 rounded-md bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 text-[11.5px] font-semibold">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><polyline points="17 11 19 13 23 9"/></svg>
      Reassign
    </button>
    <button class="inline-flex items-center gap-1 h-7 px-2 rounded-md bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 text-[11.5px] font-semibold">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Export
    </button>
    <button class="ml-auto text-indigo-700 hover:text-indigo-900 font-medium">Clear selection</button>
  </div>

  <!-- ========================================================== -->
  <!-- Claims table                                                -->
  <!-- ========================================================== -->
  <div class="rounded-2xl border border-slate-200 bg-white shad-card-lg overflow-hidden">
    <table class="w-full text-left">
      <thead class="bg-slate-50/60 border-b border-slate-100">
        <tr class="text-[10.5px] uppercase tracking-wider text-slate-500 font-semibold">
          <th class="pl-6 pr-2 py-2.5 w-10"><input type="checkbox" class="w-4 h-4 rounded border-slate-300"/></th>
          <th class="px-2 py-2.5">Claimant</th>
          <th class="px-2 py-2.5">Description</th>
          <th class="px-2 py-2.5 text-right">Amount</th>
          <th class="px-2 py-2.5">Submitted</th>
          <th class="px-2 py-2.5">Status</th>
          <th class="pl-2 pr-6 py-2.5 text-right">Actions</th>
        </tr>
      </thead>
      <tbody id="claims-tbody"></tbody>
    </table>

    <!-- Pagination -->
    <div class="flex items-center justify-between gap-3 px-6 py-3 border-t border-slate-100 bg-white text-[12px] text-slate-600">
      <div>
        Showing <span class="font-semibold text-slate-900">1–8</span> of <span class="font-semibold text-slate-900">248</span> claims
      </div>
      <div class="flex items-center gap-1">
        <button class="inline-flex items-center gap-1 h-8 px-2.5 rounded-md border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 font-medium disabled:opacity-50" disabled>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          Prev
        </button>
        <div class="flex items-center gap-0.5 px-1 text-[12px]">
          <button class="w-7 h-7 grid place-items-center rounded-md bg-slate-900 text-white font-semibold">1</button>
          <button class="w-7 h-7 grid place-items-center rounded-md hover:bg-slate-100 text-slate-700">2</button>
          <button class="w-7 h-7 grid place-items-center rounded-md hover:bg-slate-100 text-slate-700">3</button>
          <span class="w-5 text-center text-slate-400">…</span>
          <button class="w-7 h-7 grid place-items-center rounded-md hover:bg-slate-100 text-slate-700">31</button>
        </div>
        <button class="inline-flex items-center gap-1 h-8 px-2.5 rounded-md border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 font-medium">
          Next
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>
      <div class="flex items-center gap-2">
        <span class="text-slate-500">Rows per page</span>
        <button class="inline-flex items-center gap-1 h-8 px-2 rounded-md border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 font-medium">
          8
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-400"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Footer hint -->
  <div class="flex items-center justify-between mt-4 text-[12px] text-slate-500">
    <span>Synced from Finance · last refresh 2 min ago</span>
    <span class="inline-flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>Live</span>
  </div>
</div>

<script src="claims-stats.js"></script>
</body>
</html>
